[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patch-bay"
version = "1.0.0"
description = "A deterministic rectangular fabric cutting planner for quilting projects."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Andrizre"}]

[project.scripts]
patch-bay = "patchbay.cli:main"

[tool.setuptools.packages.find]
include = ["patchbay*"]
